name: Cleanup Staging

on:
  pull_request:
    types: [closed]
    branches: [main]

# PR close 后停 staging 容器（保留 volumes，下个 PR 重用）
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Stop staging stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            if [ -d /opt/finsim-staging ]; then
              cd /opt/finsim-staging
              docker compose -f docker-compose.staging.yml -p finsim-staging down || true
              echo "Staging stopped at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /opt/finsim-staging/last-stopped-at
            fi
            docker ps --filter "name=finsim-staging" --format '{{.Names}}\t{{.Status}}' || true

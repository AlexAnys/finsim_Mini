name: Cleanup Staging

on:
  pull_request:
    types: [closed]
    branches: [main]

# Staging 是「单一共享栈」。closed PR 只在 staging 当前装的就是这个 PR 时才 down，
# 否则当前 staging 属于另一个还在 review 的 PR，一刀切会干扰别人。
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify closed PR
        id: scope
        run: python3 .github/scripts/change_policy.py --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
  cleanup:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: staging-shared
      cancel-in-progress: false
    steps:
      - name: Stop staging stack (only if owned by this PR)
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PR_NUMBER
          command_timeout: 5m
          script: |
            set -e
            if [ ! -d /opt/finsim-staging ]; then
              echo "/opt/finsim-staging missing, nothing to do"
              exit 0
            fi
            cd /opt/finsim-staging

            owner=""
            if [ -f last-deployed-pr ]; then
              owner=$(tr -d '[:space:]' < last-deployed-pr)
            fi

            if [ "$owner" != "$PR_NUMBER" ]; then
              echo "Staging is currently owned by PR=${owner:-<none>}; this PR=$PR_NUMBER; skipping teardown."
              docker ps --filter "name=finsim-staging" --format '{{.Names}}\t{{.Status}}' || true
              exit 0
            fi

            echo "Staging owned by PR $PR_NUMBER → tearing down."
            # Stop future runs first; wait for any already-running compensation before teardown.
            rm -f /etc/cron.d/finsim-staging /etc/logrotate.d/finsim-staging
            exec 9>.cron-frequent.lock
            flock -w 240 9
            docker compose -f docker-compose.staging.yml -p finsim-staging down
            echo "Staging stopped at $(date -u +%Y-%m-%dT%H:%M:%SZ) by PR $PR_NUMBER" > last-stopped-at
            rm -f last-deployed-pr
            docker ps --filter "name=finsim-staging" --format '{{.Names}}\t{{.Status}}' || true

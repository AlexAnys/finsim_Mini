name: Deploy Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Only full deployments take the shared staging lock; docs checks run immediately.

permissions:
  contents: read
  pull-requests: write

# 部署到 /opt/finsim-staging/，反代 staging.finsim.anlanai.cn → 127.0.0.1:3001
# Caddy 在 host network，独立 stack 不污染生产容器
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Select validation scope
        id: scope
        uses: ./.github/actions/change-scope

  staging-deploy:
    needs: changes
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ (needs.changes.outputs.docs_only == 'true' || needs.changes.result != 'success') && format('docs-staging-{0}', github.run_id) || 'staging-shared' }}
      cancel-in-progress: false
    steps:
      - name: Require successful scope and documentation checks
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Documentation-only check complete
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Documentation checks passed. No app dependencies, build, deployment or browser tests required.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create source tarball
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          git archive --format=tar.gz -o finsim-staging-src.tar.gz HEAD
          ls -lh finsim-staging-src.tar.gz

      - name: Copy source tarball to server
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=90
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          for attempt in 1 2 3 4; do
            if ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mkdir -p /opt/finsim-staging' \
              && scp "${ssh_opts[@]}" finsim-staging-src.tar.gz "$SERVER_USER@$SERVER_HOST:/opt/finsim-staging/finsim-staging-src.tar.gz"; then
              exit 0
            fi
            sleep $((attempt * 30))
          done

          echo "staging source upload failed after 4 attempts" >&2
          exit 1

      - name: Build and deploy staging on server
        if: needs.changes.outputs.docs_only != 'true'
        uses: appleboy/ssh-action@v1
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER }}
          AI_SIMULATION_PROVIDER: ${{ vars.AI_SIMULATION_PROVIDER }}
          AI_SIMULATION_MODEL: ${{ vars.AI_SIMULATION_MODEL }}
          AI_EVALUATION_PROVIDER: ${{ vars.AI_EVALUATION_PROVIDER }}
          AI_EVALUATION_MODEL: ${{ vars.AI_EVALUATION_MODEL }}
          AI_EVALUATION_FALLBACK_PROVIDER: ${{ vars.AI_EVALUATION_FALLBACK_PROVIDER }}
          AI_EVALUATION_FALLBACK_MODEL: ${{ vars.AI_EVALUATION_FALLBACK_MODEL }}
          AI_QUIZ_GRADE_PROVIDER: ${{ vars.AI_QUIZ_GRADE_PROVIDER }}
          AI_QUIZ_GRADE_MODEL: ${{ vars.AI_QUIZ_GRADE_MODEL }}
          AI_SUBJECTIVE_GRADE_PROVIDER: ${{ vars.AI_SUBJECTIVE_GRADE_PROVIDER }}
          AI_SUBJECTIVE_GRADE_MODEL: ${{ vars.AI_SUBJECTIVE_GRADE_MODEL }}
          AI_TASK_DRAFT_PROVIDER: ${{ vars.AI_TASK_DRAFT_PROVIDER }}
          AI_TASK_DRAFT_MODEL: ${{ vars.AI_TASK_DRAFT_MODEL }}
          AI_QUIZ_DRAFT_PROVIDER: ${{ vars.AI_QUIZ_DRAFT_PROVIDER }}
          AI_QUIZ_DRAFT_MODEL: ${{ vars.AI_QUIZ_DRAFT_MODEL }}
          AI_SUBJECTIVE_DRAFT_PROVIDER: ${{ vars.AI_SUBJECTIVE_DRAFT_PROVIDER }}
          AI_SUBJECTIVE_DRAFT_MODEL: ${{ vars.AI_SUBJECTIVE_DRAFT_MODEL }}
          AI_LESSON_POLISH_PROVIDER: ${{ vars.AI_LESSON_POLISH_PROVIDER }}
          AI_LESSON_POLISH_MODEL: ${{ vars.AI_LESSON_POLISH_MODEL }}
          AI_IDEOLOGY_MINING_PROVIDER: ${{ vars.AI_IDEOLOGY_MINING_PROVIDER }}
          AI_IDEOLOGY_MINING_MODEL: ${{ vars.AI_IDEOLOGY_MINING_MODEL }}
          AI_QUESTION_ANALYSIS_PROVIDER: ${{ vars.AI_QUESTION_ANALYSIS_PROVIDER }}
          AI_QUESTION_ANALYSIS_MODEL: ${{ vars.AI_QUESTION_ANALYSIS_MODEL }}
          AI_EXAM_CHECK_PROVIDER: ${{ vars.AI_EXAM_CHECK_PROVIDER }}
          AI_EXAM_CHECK_MODEL: ${{ vars.AI_EXAM_CHECK_MODEL }}
          AI_STUDY_BUDDY_PROVIDER: ${{ vars.AI_STUDY_BUDDY_PROVIDER }}
          AI_STUDY_BUDDY_MODEL: ${{ vars.AI_STUDY_BUDDY_MODEL }}
          AI_IMPORT_PROVIDER: ${{ vars.AI_IMPORT_PROVIDER }}
          AI_IMPORT_MODEL: ${{ vars.AI_IMPORT_MODEL }}
          AI_INSIGHTS_PROVIDER: ${{ vars.AI_INSIGHTS_PROVIDER }}
          AI_INSIGHTS_MODEL: ${{ vars.AI_INSIGHTS_MODEL }}
          AI_WEEKLY_INSIGHT_PROVIDER: ${{ vars.AI_WEEKLY_INSIGHT_PROVIDER }}
          AI_WEEKLY_INSIGHT_MODEL: ${{ vars.AI_WEEKLY_INSIGHT_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GIT_SHA,PR_NUMBER,CRON_TOKEN,MIMO_API_KEY,MIMO_BASE_URL,DEEPSEEK_API_KEY,DEEPSEEK_BASE_URL,AI_PROVIDER,AI_FALLBACK_PROVIDER,AI_SIMULATION_PROVIDER,AI_SIMULATION_MODEL,AI_EVALUATION_PROVIDER,AI_EVALUATION_MODEL,AI_EVALUATION_FALLBACK_PROVIDER,AI_EVALUATION_FALLBACK_MODEL,AI_QUIZ_GRADE_PROVIDER,AI_QUIZ_GRADE_MODEL,AI_SUBJECTIVE_GRADE_PROVIDER,AI_SUBJECTIVE_GRADE_MODEL,AI_TASK_DRAFT_PROVIDER,AI_TASK_DRAFT_MODEL,AI_QUIZ_DRAFT_PROVIDER,AI_QUIZ_DRAFT_MODEL,AI_SUBJECTIVE_DRAFT_PROVIDER,AI_SUBJECTIVE_DRAFT_MODEL,AI_LESSON_POLISH_PROVIDER,AI_LESSON_POLISH_MODEL,AI_IDEOLOGY_MINING_PROVIDER,AI_IDEOLOGY_MINING_MODEL,AI_QUESTION_ANALYSIS_PROVIDER,AI_QUESTION_ANALYSIS_MODEL,AI_EXAM_CHECK_PROVIDER,AI_EXAM_CHECK_MODEL,AI_STUDY_BUDDY_PROVIDER,AI_STUDY_BUDDY_MODEL,AI_IMPORT_PROVIDER,AI_IMPORT_MODEL,AI_INSIGHTS_PROVIDER,AI_INSIGHTS_MODEL,AI_WEEKLY_INSIGHT_PROVIDER,AI_WEEKLY_INSIGHT_MODEL
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/finsim-staging
            bootstrap=$(mktemp -d)
            trap 'rm -rf "$bootstrap"' EXIT
            tar -xzf finsim-staging-src.tar.gz -C "$bootstrap" scripts/ops
            bash "$bootstrap/scripts/ops/deploy-release.sh" /opt/finsim-staging staging "/opt/finsim-staging/finsim-staging-src.tar.gz" "$GIT_SHA" "${PR_NUMBER:-}"

      - name: Verify deployed revision and database readiness
        if: needs.changes.outputs.docs_only != 'true'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ops/verify-ready.py https://staging.finsim.anlanai.cn "$EXPECTED_SHA"

      # PR-1 A: Playwright 主线 smoke (5 specs) 真浏览器跑 staging.
      # 用 seeded baseline 账号 (teacher1/student1 @finsim.edu.cn / password123) —
      # 不依赖 molly 演示数据；smoke 内自造 task/instance 并自清理.
      # fail-on-error 硬阻塞 PR merge；retries: 2 (playwright.config.ts) 容忍 staging 共享栈短暂不稳.
      # 监测点: 若 ≥3 个 PR 因 flaky 红, 考虑降级 retries 或拆 critical-only.
      - name: Install Node for Playwright
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Playwright only needed)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 5 主线 smoke (staging)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          PLAYWRIGHT_BASE_URL: https://staging.finsim.anlanai.cn
          CI: "true"
          PLAYWRIGHT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx playwright test

      - name: Upload Playwright trace + screenshots on failure
        if: failure() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.pull_request.number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Comment staging URL on PR
        if: success() && needs.changes.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BODY=$(cat <<EOF
          ✅ **Staging deployed**

          - URL: https://staging.finsim.anlanai.cn
          - Commit: \`${GIT_SHA:0:7}\`
          - 版本核验: https://staging.finsim.anlanai.cn/api/version（实测前后须与本 PR commit 一致）
          - Stack: \`docker compose -p finsim-staging\`

          请用 \`teacher1@finsim.edu.cn / password123\` / \`student1@finsim.edu.cn / password123\` 实测。

          确认无问题后点 **Squash and merge** 推生产。
          EOF
          )

          # 找已有 staging deploy 评论编辑掉，避免每次 push 刷屏
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("✅ **Staging deployed**")))][0].id // empty')

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

# 部署架构：runner 跑 quality 检查 → 打包源码 tarball → scp 到阿里云服务器 →
# 服务器本地 docker compose build + up。不再走 ghcr.io 镜像推拉，规避国际带宽问题。
#
# 备用方案（A+E）：如本路径出现问题，可 git revert 此 workflow 切回 ghcr.io 推拉路径。
# Dockerfile / .dockerignore 已是优化版本（standalone 分层 + 排除非必要文件），
# 无论走哪条路径都受益。

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --passWithNoTests

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          # git archive 自动排除 .git 和 untracked 文件
          # docker build 阶段 .dockerignore 还会再次过滤
          git archive --format=tar.gz -o finsim-src.tar.gz HEAD
          ls -lh finsim-src.tar.gz

      - name: Copy source tarball to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=90
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          for attempt in 1 2 3 4; do
            if ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mkdir -p /opt/finsim' \
              && scp "${ssh_opts[@]}" finsim-src.tar.gz "$SERVER_USER@$SERVER_HOST:/opt/finsim/finsim-src.tar.gz"; then
              exit 0
            fi
            sleep $((attempt * 30))
          done

          echo "source upload failed after 4 attempts" >&2
          exit 1

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GIT_SHA: ${{ github.sha }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GIT_SHA,MIMO_API_KEY,MIMO_BASE_URL
          command_timeout: 60m
          script: |
            set -e
            cd /opt/finsim

            touch .env

            get_env_value() {
              grep -E "^$1=" .env | tail -n 1 | cut -d= -f2- || true
            }

            has_env_value() {
              value="$(get_env_value "$1")"
              [ -n "$value" ]
            }

            set_env_value() {
              name="$1"
              value="$2"
              [ -n "$value" ] || return 0
              grep -v -E "^${name}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s=%s\n' "$name" "$value" >> .env
            }

            ensure_env_value() {
              name="$1"
              value="$2"
              if ! has_env_value "$name"; then
                set_env_value "$name" "$value"
              fi
            }

            if ! has_env_value AUTH_SECRET && ! has_env_value NEXTAUTH_SECRET; then
              generated_auth_secret="$(openssl rand -base64 48 | tr -d '\n')"
              set_env_value AUTH_SECRET "$generated_auth_secret"
              set_env_value NEXTAUTH_SECRET "$generated_auth_secret"
            elif ! has_env_value AUTH_SECRET; then
              set_env_value AUTH_SECRET "$(get_env_value NEXTAUTH_SECRET)"
            elif ! has_env_value NEXTAUTH_SECRET; then
              set_env_value NEXTAUTH_SECRET "$(get_env_value AUTH_SECRET)"
            fi

            ensure_env_value POSTGRES_PASSWORD finsim_dev_password
            ensure_env_value ADMIN_KEY "$(openssl rand -hex 32)"
            set_env_value AI_PROVIDER mimo
            set_env_value AI_FALLBACK_PROVIDER mimo
            set_env_value MIMO_API_KEY "${MIMO_API_KEY:-}"
            set_env_value MIMO_BASE_URL "${MIMO_BASE_URL:-}"
            ensure_env_value MIMO_MODEL mimo-v2.5-pro

            # 解压源码（覆盖现有源码文件；保留 .env、last-deployed-* 等非源码文件）
            tar -xzf finsim-src.tar.gz
            rm finsim-src.tar.gz

            # 构建 app image（postgres 用 image，无 build 段，不动）
            # docker layer cache 在服务器本地，第二次起 standalone node_modules 层缓存命中
            docker compose build app

            # 启动/更新 app（postgres 已运行 → 保留，复用 pgdata 卷与 uploads 卷）
            docker compose up -d app

            # uploads volume may come from an older deployment/user id. The app runs as
            # nextjs (uid 1001), so normalize ownership on every deploy.
            docker compose exec -T -u root app sh -lc 'mkdir -p /data/uploads && chown -R 1001:65533 /data/uploads && chmod -R u+rwX /data/uploads'

            # 清理 dangling images
            docker image prune -f

            # 记录部署元数据
            echo "${GIT_SHA}" > /opt/finsim/last-deployed-sha
            date -u +"%Y-%m-%dT%H:%M:%SZ" > /opt/finsim/last-deployed-at

            # 简单健康检查
            sleep 5
            docker compose ps

name: Deploy

on:
  push:
    branches:
      - main

# 部署架构：runner 跑 quality 检查 → 打包源码 tarball → scp 到阿里云服务器 →
# 服务器本地 docker compose build + up。不再走 ghcr.io 镜像推拉，规避国际带宽问题。
#
# 备用方案（A+E）：如本路径出现问题，可 git revert 此 workflow 切回 ghcr.io 推拉路径。
# Dockerfile / .dockerignore 已是优化版本（standalone 分层 + 排除非必要文件），
# 无论走哪条路径都受益。

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select validation scope
        id: changes
        uses: ./.github/actions/change-scope

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: steps.changes.outputs.docs_only != 'true'
        run: npx prisma generate

      - name: Type check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: npx vitest run --passWithNoTests

  deploy:
    needs: quality
    if: needs.quality.outputs.docs_only != 'true'
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source tarball
        run: |
          # git archive 自动排除 .git 和 untracked 文件
          # docker build 阶段 .dockerignore 还会再次过滤
          python3 scripts/ops/archive-source.py --ref HEAD --output finsim-src.tar.gz
          ls -lh finsim-src.tar.gz

      - name: Copy source tarball to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh_opts=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=90
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          for attempt in 1 2 3 4; do
            if ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_HOST" 'mkdir -p /opt/finsim' \
              && scp "${ssh_opts[@]}" finsim-src.tar.gz "$SERVER_USER@$SERVER_HOST:/opt/finsim/finsim-src.tar.gz"; then
              exit 0
            fi
            sleep $((attempt * 30))
          done

          echo "source upload failed after 4 attempts" >&2
          exit 1

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GIT_SHA: ${{ github.sha }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER }}
          AI_SIMULATION_PROVIDER: ${{ vars.AI_SIMULATION_PROVIDER }}
          AI_SIMULATION_MODEL: ${{ vars.AI_SIMULATION_MODEL }}
          AI_EVALUATION_PROVIDER: ${{ vars.AI_EVALUATION_PROVIDER }}
          AI_EVALUATION_MODEL: ${{ vars.AI_EVALUATION_MODEL }}
          AI_EVALUATION_FALLBACK_PROVIDER: ${{ vars.AI_EVALUATION_FALLBACK_PROVIDER }}
          AI_EVALUATION_FALLBACK_MODEL: ${{ vars.AI_EVALUATION_FALLBACK_MODEL }}
          AI_QUIZ_GRADE_PROVIDER: ${{ vars.AI_QUIZ_GRADE_PROVIDER }}
          AI_QUIZ_GRADE_MODEL: ${{ vars.AI_QUIZ_GRADE_MODEL }}
          AI_SUBJECTIVE_GRADE_PROVIDER: ${{ vars.AI_SUBJECTIVE_GRADE_PROVIDER }}
          AI_SUBJECTIVE_GRADE_MODEL: ${{ vars.AI_SUBJECTIVE_GRADE_MODEL }}
          AI_TASK_DRAFT_PROVIDER: ${{ vars.AI_TASK_DRAFT_PROVIDER }}
          AI_TASK_DRAFT_MODEL: ${{ vars.AI_TASK_DRAFT_MODEL }}
          AI_QUIZ_DRAFT_PROVIDER: ${{ vars.AI_QUIZ_DRAFT_PROVIDER }}
          AI_QUIZ_DRAFT_MODEL: ${{ vars.AI_QUIZ_DRAFT_MODEL }}
          AI_SUBJECTIVE_DRAFT_PROVIDER: ${{ vars.AI_SUBJECTIVE_DRAFT_PROVIDER }}
          AI_SUBJECTIVE_DRAFT_MODEL: ${{ vars.AI_SUBJECTIVE_DRAFT_MODEL }}
          AI_LESSON_POLISH_PROVIDER: ${{ vars.AI_LESSON_POLISH_PROVIDER }}
          AI_LESSON_POLISH_MODEL: ${{ vars.AI_LESSON_POLISH_MODEL }}
          AI_IDEOLOGY_MINING_PROVIDER: ${{ vars.AI_IDEOLOGY_MINING_PROVIDER }}
          AI_IDEOLOGY_MINING_MODEL: ${{ vars.AI_IDEOLOGY_MINING_MODEL }}
          AI_QUESTION_ANALYSIS_PROVIDER: ${{ vars.AI_QUESTION_ANALYSIS_PROVIDER }}
          AI_QUESTION_ANALYSIS_MODEL: ${{ vars.AI_QUESTION_ANALYSIS_MODEL }}
          AI_EXAM_CHECK_PROVIDER: ${{ vars.AI_EXAM_CHECK_PROVIDER }}
          AI_EXAM_CHECK_MODEL: ${{ vars.AI_EXAM_CHECK_MODEL }}
          AI_STUDY_BUDDY_PROVIDER: ${{ vars.AI_STUDY_BUDDY_PROVIDER }}
          AI_STUDY_BUDDY_MODEL: ${{ vars.AI_STUDY_BUDDY_MODEL }}
          AI_IMPORT_PROVIDER: ${{ vars.AI_IMPORT_PROVIDER }}
          AI_IMPORT_MODEL: ${{ vars.AI_IMPORT_MODEL }}
          AI_INSIGHTS_PROVIDER: ${{ vars.AI_INSIGHTS_PROVIDER }}
          AI_INSIGHTS_MODEL: ${{ vars.AI_INSIGHTS_MODEL }}
          AI_WEEKLY_INSIGHT_PROVIDER: ${{ vars.AI_WEEKLY_INSIGHT_PROVIDER }}
          AI_WEEKLY_INSIGHT_MODEL: ${{ vars.AI_WEEKLY_INSIGHT_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GIT_SHA,PR_NUMBER,CRON_TOKEN,MIMO_API_KEY,MIMO_BASE_URL,DEEPSEEK_API_KEY,DEEPSEEK_BASE_URL,AI_PROVIDER,AI_FALLBACK_PROVIDER,AI_SIMULATION_PROVIDER,AI_SIMULATION_MODEL,AI_EVALUATION_PROVIDER,AI_EVALUATION_MODEL,AI_EVALUATION_FALLBACK_PROVIDER,AI_EVALUATION_FALLBACK_MODEL,AI_QUIZ_GRADE_PROVIDER,AI_QUIZ_GRADE_MODEL,AI_SUBJECTIVE_GRADE_PROVIDER,AI_SUBJECTIVE_GRADE_MODEL,AI_TASK_DRAFT_PROVIDER,AI_TASK_DRAFT_MODEL,AI_QUIZ_DRAFT_PROVIDER,AI_QUIZ_DRAFT_MODEL,AI_SUBJECTIVE_DRAFT_PROVIDER,AI_SUBJECTIVE_DRAFT_MODEL,AI_LESSON_POLISH_PROVIDER,AI_LESSON_POLISH_MODEL,AI_IDEOLOGY_MINING_PROVIDER,AI_IDEOLOGY_MINING_MODEL,AI_QUESTION_ANALYSIS_PROVIDER,AI_QUESTION_ANALYSIS_MODEL,AI_EXAM_CHECK_PROVIDER,AI_EXAM_CHECK_MODEL,AI_STUDY_BUDDY_PROVIDER,AI_STUDY_BUDDY_MODEL,AI_IMPORT_PROVIDER,AI_IMPORT_MODEL,AI_INSIGHTS_PROVIDER,AI_INSIGHTS_MODEL,AI_WEEKLY_INSIGHT_PROVIDER,AI_WEEKLY_INSIGHT_MODEL
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/finsim
            bootstrap=$(mktemp -d)
            trap 'rm -rf "$bootstrap"' EXIT
            tar -xzf finsim-src.tar.gz -C "$bootstrap" scripts/ops
            bash "$bootstrap/scripts/ops/deploy-release.sh" /opt/finsim production "/opt/finsim/finsim-src.tar.gz" "$GIT_SHA" "${PR_NUMBER:-}"

      - name: Verify deployed revision and database readiness
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/ops/verify-ready.py https://finsim.anlanai.cn "$EXPECTED_SHA"

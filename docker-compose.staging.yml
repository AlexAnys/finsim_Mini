name: finsim-staging
# Staging stack（独立于生产）
#
# 部署位置: /opt/finsim-staging/
# 入口: https://staging.finsim.anlanai.cn
# Caddy: 反代 127.0.0.1:3001（caddy 在 host network）
#
# 启停（compose project 名固定为 finsim-staging）:
#   docker compose -f docker-compose.staging.yml -p finsim-staging up -d --build
#   docker compose -f docker-compose.staging.yml -p finsim-staging down
#
# Migration / seed（首次或手动）:
#   docker compose -f docker-compose.staging.yml -p finsim-staging exec staging-app npx prisma migrate deploy
#   docker compose -f docker-compose.staging.yml -p finsim-staging exec staging-app npm run db:seed
services:
  staging-app:
    container_name: finsim-staging-app
    image: finsim-staging-app:${APP_GIT_SHA:-development}
    build:
      context: ${FINSIM_BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-development}
    ports:
      - "3001:3000"
    depends_on:
      staging-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://finsim:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@staging-postgres:5432/finsim
      - AUTH_SECRET=${AUTH_SECRET:-${NEXTAUTH_SECRET:?AUTH_SECRET or NEXTAUTH_SECRET must be set}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-${AUTH_SECRET:?AUTH_SECRET or NEXTAUTH_SECRET must be set}}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://staging.finsim.anlanai.cn}
      - AUTH_TRUST_HOST=true
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY must be set}
      - ENABLE_STUDENT_SELF_REGISTRATION=${ENABLE_STUDENT_SELF_REGISTRATION:-true}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-deepseek}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      - MIMO_OCR_MODEL=${MIMO_OCR_MODEL:-mimo-v2-omni}
      - MIMO_ANTHROPIC_BASE_URL=${MIMO_ANTHROPIC_BASE_URL:-https://token-plan-cn.xiaomimimo.com/anthropic}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-turbo}
      - OCR_PROVIDER=${OCR_PROVIDER:-qwen}
      - QWEN_OCR_MODEL=${QWEN_OCR_MODEL:-qwen-vl-ocr}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      - OCR_MIN_TEXT_CHARS=${OCR_MIN_TEXT_CHARS:-200}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - CRON_TOKEN=${CRON_TOKEN:?CRON_TOKEN must be set}
      - APP_GIT_SHA=${APP_GIT_SHA:-development}
      - APP_ENV=${APP_ENV:-staging}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_PROXY_URL=${GEMINI_PROXY_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - AI_SIMULATION_PROVIDER=${AI_SIMULATION_PROVIDER:-deepseek}
      - AI_SIMULATION_MODEL=${AI_SIMULATION_MODEL:-deepseek-v4-flash}
      - AI_EVALUATION_PROVIDER=${AI_EVALUATION_PROVIDER:-deepseek}
      - AI_EVALUATION_MODEL=${AI_EVALUATION_MODEL:-deepseek-v4-pro}
      - AI_EVALUATION_FALLBACK_PROVIDER=${AI_EVALUATION_FALLBACK_PROVIDER:-deepseek}
      - AI_EVALUATION_FALLBACK_MODEL=${AI_EVALUATION_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_QUIZ_GRADE_PROVIDER=${AI_QUIZ_GRADE_PROVIDER:-deepseek}
      - AI_QUIZ_GRADE_MODEL=${AI_QUIZ_GRADE_MODEL:-deepseek-v4-flash}
      - AI_SUBJECTIVE_GRADE_PROVIDER=${AI_SUBJECTIVE_GRADE_PROVIDER:-deepseek}
      - AI_SUBJECTIVE_GRADE_MODEL=${AI_SUBJECTIVE_GRADE_MODEL:-deepseek-v4-pro}
      - AI_TASK_DRAFT_PROVIDER=${AI_TASK_DRAFT_PROVIDER:-deepseek}
      - AI_TASK_DRAFT_MODEL=${AI_TASK_DRAFT_MODEL:-deepseek-v4-pro}
      - AI_QUIZ_DRAFT_PROVIDER=${AI_QUIZ_DRAFT_PROVIDER:-deepseek}
      - AI_QUIZ_DRAFT_MODEL=${AI_QUIZ_DRAFT_MODEL:-deepseek-v4-pro}
      - AI_SUBJECTIVE_DRAFT_PROVIDER=${AI_SUBJECTIVE_DRAFT_PROVIDER:-deepseek}
      - AI_SUBJECTIVE_DRAFT_MODEL=${AI_SUBJECTIVE_DRAFT_MODEL:-deepseek-v4-pro}
      - AI_LESSON_POLISH_PROVIDER=${AI_LESSON_POLISH_PROVIDER:-deepseek}
      - AI_LESSON_POLISH_MODEL=${AI_LESSON_POLISH_MODEL:-deepseek-v4-pro}
      - AI_IDEOLOGY_MINING_PROVIDER=${AI_IDEOLOGY_MINING_PROVIDER:-deepseek}
      - AI_IDEOLOGY_MINING_MODEL=${AI_IDEOLOGY_MINING_MODEL:-deepseek-v4-pro}
      - AI_QUESTION_ANALYSIS_PROVIDER=${AI_QUESTION_ANALYSIS_PROVIDER:-deepseek}
      - AI_QUESTION_ANALYSIS_MODEL=${AI_QUESTION_ANALYSIS_MODEL:-deepseek-v4-flash}
      - AI_EXAM_CHECK_PROVIDER=${AI_EXAM_CHECK_PROVIDER:-deepseek}
      - AI_EXAM_CHECK_MODEL=${AI_EXAM_CHECK_MODEL:-deepseek-v4-pro}
      - AI_STUDY_BUDDY_PROVIDER=${AI_STUDY_BUDDY_PROVIDER:-deepseek}
      - AI_STUDY_BUDDY_MODEL=${AI_STUDY_BUDDY_MODEL:-deepseek-v4-flash}
      - AI_IMPORT_PROVIDER=${AI_IMPORT_PROVIDER:-deepseek}
      - AI_IMPORT_MODEL=${AI_IMPORT_MODEL:-deepseek-v4-flash}
      - AI_INSIGHTS_PROVIDER=${AI_INSIGHTS_PROVIDER:-deepseek}
      - AI_INSIGHTS_MODEL=${AI_INSIGHTS_MODEL:-deepseek-v4-pro}
      - AI_WEEKLY_INSIGHT_PROVIDER=${AI_WEEKLY_INSIGHT_PROVIDER:-deepseek}
      - AI_WEEKLY_INSIGHT_MODEL=${AI_WEEKLY_INSIGHT_MODEL:-deepseek-v4-pro}
      - AI_RATE_LIMIT_ENABLED=${AI_RATE_LIMIT_ENABLED:-}
      - AI_RATE_LIMIT_WINDOW_MS=${AI_RATE_LIMIT_WINDOW_MS:-}
      - AI_RATE_LIMIT_MAX_PER_FEATURE=${AI_RATE_LIMIT_MAX_PER_FEATURE:-}
      - AI_SIMULATION_FALLBACK_PROVIDER=${AI_SIMULATION_FALLBACK_PROVIDER:-deepseek}
      - AI_SIMULATION_FALLBACK_MODEL=${AI_SIMULATION_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_TASK_DRAFT_FALLBACK_PROVIDER=${AI_TASK_DRAFT_FALLBACK_PROVIDER:-deepseek}
      - AI_TASK_DRAFT_FALLBACK_MODEL=${AI_TASK_DRAFT_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_QUIZ_DRAFT_FALLBACK_PROVIDER=${AI_QUIZ_DRAFT_FALLBACK_PROVIDER:-deepseek}
      - AI_QUIZ_DRAFT_FALLBACK_MODEL=${AI_QUIZ_DRAFT_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_SUBJECTIVE_DRAFT_FALLBACK_PROVIDER=${AI_SUBJECTIVE_DRAFT_FALLBACK_PROVIDER:-deepseek}
      - AI_SUBJECTIVE_DRAFT_FALLBACK_MODEL=${AI_SUBJECTIVE_DRAFT_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_IMPORT_FALLBACK_PROVIDER=${AI_IMPORT_FALLBACK_PROVIDER:-deepseek}
      - AI_IMPORT_FALLBACK_MODEL=${AI_IMPORT_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_QUIZ_GRADE_FALLBACK_PROVIDER=${AI_QUIZ_GRADE_FALLBACK_PROVIDER:-deepseek}
      - AI_QUIZ_GRADE_FALLBACK_MODEL=${AI_QUIZ_GRADE_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_SUBJECTIVE_GRADE_FALLBACK_PROVIDER=${AI_SUBJECTIVE_GRADE_FALLBACK_PROVIDER:-deepseek}
      - AI_SUBJECTIVE_GRADE_FALLBACK_MODEL=${AI_SUBJECTIVE_GRADE_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_STUDY_BUDDY_FALLBACK_PROVIDER=${AI_STUDY_BUDDY_FALLBACK_PROVIDER:-deepseek}
      - AI_STUDY_BUDDY_FALLBACK_MODEL=${AI_STUDY_BUDDY_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_INSIGHTS_FALLBACK_PROVIDER=${AI_INSIGHTS_FALLBACK_PROVIDER:-deepseek}
      - AI_INSIGHTS_FALLBACK_MODEL=${AI_INSIGHTS_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_WEEKLY_INSIGHT_FALLBACK_PROVIDER=${AI_WEEKLY_INSIGHT_FALLBACK_PROVIDER:-deepseek}
      - AI_WEEKLY_INSIGHT_FALLBACK_MODEL=${AI_WEEKLY_INSIGHT_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_LESSON_POLISH_FALLBACK_PROVIDER=${AI_LESSON_POLISH_FALLBACK_PROVIDER:-deepseek}
      - AI_LESSON_POLISH_FALLBACK_MODEL=${AI_LESSON_POLISH_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_IDEOLOGY_MINING_FALLBACK_PROVIDER=${AI_IDEOLOGY_MINING_FALLBACK_PROVIDER:-deepseek}
      - AI_IDEOLOGY_MINING_FALLBACK_MODEL=${AI_IDEOLOGY_MINING_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_QUESTION_ANALYSIS_FALLBACK_PROVIDER=${AI_QUESTION_ANALYSIS_FALLBACK_PROVIDER:-deepseek}
      - AI_QUESTION_ANALYSIS_FALLBACK_MODEL=${AI_QUESTION_ANALYSIS_FALLBACK_MODEL:-deepseek-v4-flash}
      - AI_EXAM_CHECK_FALLBACK_PROVIDER=${AI_EXAM_CHECK_FALLBACK_PROVIDER:-deepseek}
      - AI_EXAM_CHECK_FALLBACK_MODEL=${AI_EXAM_CHECK_FALLBACK_MODEL:-deepseek-v4-flash}
      - FILE_STORAGE_TYPE=local
      - FILE_STORAGE_PATH=/data/uploads
    volumes:
      - staging-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  staging-postgres:
    container_name: finsim-staging-postgres
    image: postgres:16-alpine
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=finsim
      - POSTGRES_USER=finsim
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsim"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  staging-pgdata:
  staging-uploads:
